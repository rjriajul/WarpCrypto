[package]
name = "warpcrypto"
version = "2.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fast AES-256-IGE, AES-256-CTR and MTProto 2.0 message packing for Telegram clients"
license = "Apache-2.0"
repository = "https://github.com/rjriajul/WarpCrypto"
readme = "README.md"
keywords = ["mtproto", "telegram", "aes", "ige", "crypto"]
categories = ["cryptography"]

# maturin takes the Python module name from here; it adds the cdylib crate type itself
[lib]
name = "warpcrypto"

[features]
# Builds the Python extension module; maturin turns this on (see pyproject.toml).
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.29.0", optional = true }
sha2 = "0.10"
getrandom = "0.2"

[dependencies.aes]
# 0.9.3 raised the aes MSRV to 1.89; keep this cap until rust-version moves past it
version = ">=0.9.2, <0.9.3"
# no `zeroize` feature: it wipes the cipher a byte at a time on every drop; `Wiped` in lib.rs
# wipes the same bytes a word at a time

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
