name: WarpCrypto

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "pypy3.11"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install maturin

      - name: Build
        run: maturin build --release --out dist

      - name: Install wheel
        shell: bash
        run: pip install dist/*.whl

      - name: Run tests
        run: pip install pytest && pytest

      # A module that does not declare free-threading support switches the GIL
      # back on at import, which would make the 3.14t wheel a lie.
      - name: GIL stays disabled
        if: matrix.python-version == '3.14t'
        run: python -W error -c "import sys, warpcrypto; assert not sys._is_gil_enabled()"

      - name: Store wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*.whl
