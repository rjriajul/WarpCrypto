name: WarpCrypto

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "pypy3.11"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install maturin

      - name: Build
        run: maturin build --release --out dist

      - name: Install wheel
        shell: bash
        run: pip install dist/*.whl

      - name: Run tests
        run: pip install pytest && pytest

      - name: GIL stays disabled
        if: matrix.python-version == '3.14t'
        run: python -W error -c "import sys, warpcrypto; assert not sys._is_gil_enabled()"

      - name: Store wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*.whl

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        # 1.85 is the rust-version in Cargo.toml
        toolchain: ["1.85", stable]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy

      - name: Test
        run: cargo test --release

      - name: Clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Package
        if: matrix.toolchain == 'stable' && matrix.os == 'ubuntu-latest'
        run: cargo publish --dry-run
